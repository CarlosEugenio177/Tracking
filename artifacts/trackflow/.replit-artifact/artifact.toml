kind = "web"
previewPath = "/"
title = "TrackFlow"
version = "1.0.0"
id = "artifacts/trackflow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22867

[services.development]
run = "pnpm --filter @workspace/trackflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trackflow", "run", "build" ]
serve = "static"
publicDir = "artifacts/trackflow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22867"
BASE_PATH = "/"
